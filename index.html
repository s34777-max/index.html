<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของฉัน - สุรางคนา</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #EBF3FA; 
            color: #333;
            text-align: center; 
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white; 
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(25, 118, 210, 0.15);
            max-width: 520px; 
            width: 100%;
            padding: 40px 30px;
            border: 2px solid #90CAF9;
        }

        .profile-frame {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 16 / 9;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #2196F3;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.2);
            background-color: #E3F2FD;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 { 
            color: #0D47A1;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        p { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            margin-bottom: 25px;
            color: #424242;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #1976D2; 
            color: white; 
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }

        .btn-primary:hover {
            background: #1565C0;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #E3F2FD;
            color: #1565C0;
            border: 1px solid #90CAF9;
        }

        .btn-secondary:hover {
            background: #BBDEFB;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-frame">
            <img src="pyface.jpg" alt="Surangkhana Photo" class="profile-img">
        </div>

        <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
        <p>
            สวัสดีค่ะ ดิฉันชื่อ <strong>นางสาว สุรางคนา คุณรักษา</strong><br>
            ขณะนี้กำลังศึกษาอยู่ในแผนการเรียน Computer Science & Engineering ณ โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"
        </p>

        <div class="btn-group">
            <a href="intro.html" class="btn btn-primary">เริ่มต้นอ่านคำนำ →</a>
            <a href="about.html" class="btn btn-secondary">ประวัติส่วนตัว</a>
            <a href="portfolio.html" class="btn btn-secondary">ผลงานและเกียรติบัตร</a>
            <a href="thankyou.html" class="btn btn-secondary">หน้าปิดท้าย</a>
        </div>
    </div>

</body>
</html>
